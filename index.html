<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-v2.png" />
    <link rel="apple-touch-icon" href="/favicon-v2.png" />
    <!-- interactive-widget: ao abrir o teclado do Android, a pagina encolhe em vez de
         ser empurrada para cima — o campo em foco continua visivel. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SOS Almoxarifado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      try { if (localStorage.getItem('tema') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
