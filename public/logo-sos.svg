<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 165" fill="none">
  <!-- S esquerdo — encosta no círculo -->
  <text x="0" y="150"
        font-family="Impact,'Arial Black',Helvetica,sans-serif"
        font-size="158" font-weight="900" fill="#CC0000">S</text>

  <!-- Círculo O — centro a 170, raio 80, encostando no S (~x=90) -->
  <circle cx="170" cy="80" r="80" fill="#CC0000"/>

  <!-- Raio: de cima-direita para baixo-esquerda -->
  <polygon fill="white"
           points="200,14  158,82  183,82  138,146  180,78  155,78"/>

  <!-- S direito — começa em 252 (170+80+2) -->
  <text x="252" y="150"
        font-family="Impact,'Arial Black',Helvetica,sans-serif"
        font-size="158" font-weight="900" fill="#CC0000">S</text>
</svg>
